<style>
/* Layout: a closet rail of photo cards, each carrying a punched kraft-paper hangtag with its cost per wear; tabs top on desktop, bottom on phone.
   Palette: brown tones, from linen ground to chocolate accent, with caramel kraft tags. */
:root {
  --bg: #F3EEE8;
  --surface: #FFFCF8;
  --surface-2: #E9E0D6;
  --stage: #EDE5DB;
  --ink: #2B1E16;
  --muted: #7A6656;
  --line: #DDD1C4;
  --accent: #6B4226;
  --accent-ink: #FFF8F0;
  --tag: #D9B892;
  --tag-ink: #4A2E1A;
  --warn: #A0621A;
  --danger: #A8392B;
  --check-a: #FFFCF8;
  --check-b: #ECE3D8;
  /* chart series, in fixed order (checked for colour-blind separation); "not set" slices use --none */
  --c1: #A85A22; --c2: #00869C; --c3: #E0A93E; --c4: #B8466E; --c5: #5F9E3A; --c6: #6E6FD0; --c7: #D86A3A; --c8: #A88F7A; --none: #E2D8CD;
  --shadow: 0 1px 2px rgba(43,30,22,.07), 0 8px 24px rgba(43,30,22,.09);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17110D; --surface: #211913; --surface-2: #2C2219; --stage: #261D16; --ink: #F1E7DC; --muted: #B29C88;
    --line: #3A2E24; --accent: #C99A6B; --accent-ink: #1E140C; --tag: #5A4029; --tag-ink: #F2DBBE;
    --warn: #E0A85A; --danger: #EE8A78; --check-a: #2A2119; --check-b: #211913;
    --c1: #BF7838; --c2: #1F9EA6; --c3: #B48C2C; --c4: #CC648A; --c5: #62973E; --c6: #8183DE; --c7: #CC6A3C; --c8: #8C7867; --none: #3A2E24;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #17110D; --surface: #211913; --surface-2: #2C2219; --stage: #261D16; --ink: #F1E7DC; --muted: #B29C88;
    --line: #3A2E24; --accent: #C99A6B; --accent-ink: #1E140C; --tag: #5A4029; --tag-ink: #F2DBBE;
    --warn: #E0A85A; --danger: #EE8A78; --check-a: #2A2119; --check-b: #211913;
    --c1: #BF7838; --c2: #1F9EA6; --c3: #B48C2C; --c4: #CC648A; --c5: #62973E; --c6: #8183DE; --c7: #CC6A3C; --c8: #8C7867; --none: #3A2E24;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3); color-scheme: dark;
}
/* your look: accent colour, letters, text size and a compact closet, chosen in Settings › Look */
:root[data-accent="olive"] { --accent: #4F5D2F; } :root[data-accent="rose"] { --accent: #94445A; } :root[data-accent="navy"] { --accent: #2C4A6E; } :root[data-accent="terracotta"] { --accent: #A0432A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"])[data-accent="olive"] { --accent: #A9B77A; } :root:not([data-theme="light"])[data-accent="rose"] { --accent: #DB9DAE; } :root:not([data-theme="light"])[data-accent="navy"] { --accent: #93B3D8; } :root:not([data-theme="light"])[data-accent="terracotta"] { --accent: #E28C6A; } }
:root[data-theme="dark"][data-accent="olive"] { --accent: #A9B77A; } :root[data-theme="dark"][data-accent="rose"] { --accent: #DB9DAE; } :root[data-theme="dark"][data-accent="navy"] { --accent: #93B3D8; } :root[data-theme="dark"][data-accent="terracotta"] { --accent: #E28C6A; }
:root[data-font="classic"] { --display: "Fraunces", Georgia, serif; }
:root[data-font="round"] { --display: "Nunito", system-ui, sans-serif; --body: "Nunito", system-ui, sans-serif; }
:root[data-font="clean"] { --display: "Inter", system-ui, sans-serif; --body: "Inter", system-ui, sans-serif; }
:root[data-font="hand"] { --display: "Caveat", "Bradley Hand", cursive; }
:root[data-font="hand"] h1 { font-size: 1.25em; letter-spacing: 0; }
:root[data-size="s"] { zoom: .93; } :root[data-size="l"] { zoom: 1.08; } :root[data-size="xl"] { zoom: 1.16; }
:root[data-compact] .grid, :root[data-compact] .lgrid:not(.small) { grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
@media (max-width: 520px) { :root[data-compact] .grid, :root[data-compact] .lgrid:not(.small) { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; } :root[data-compact] .card .meta, :root[data-compact] .lcard .meta { padding: 6px 7px; } :root[data-compact] .card .meta b, :root[data-compact] .lcard .meta b { font-size: 12.5px; } :root[data-compact] .card .meta span, :root[data-compact] .lcard .meta span { font-size: 11px; } }
.lookopts { display: flex; flex-wrap: wrap; gap: 8px; }
.lookopts button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 12px; display: grid; gap: 2px; text-align: left; min-width: 0; }
.lookopts button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.lookopts .sw { width: 22px; height: 22px; border-radius: 50%; display: block; }
.lookopts .fs { font-size: 18px; line-height: 1.1; }
.lookopts small { color: var(--muted); font-size: 12px; }
.setgroup { display: grid; gap: 6px; margin: 10px 0; }
.quickacts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: -4px 0 14px; }
.quickacts .chip { justify-content: center; padding: 11px 12px; border-radius: 14px; font-size: 14px; white-space: normal; text-align: center; }
.dparts { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 4px 4px 10px 12px; }
.dashfoot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
.wxpick { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.wxpick .dpieces img { background: var(--stage); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* file pickers stay technically visible: Safari won't open a file field that is display:none */
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); pointer-events: none; }
html, body { background: var(--bg); color: var(--ink); margin: 0; }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; padding-top: env(safe-area-inset-top, 0px); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
img { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { font-size: 16px; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
a { color: var(--accent); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; }
.brand img { width: 34px; height: 34px; border-radius: 50%; flex: none; }
nav.tabs { display: flex; gap: 4px; margin-left: 12px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button { border: 0; background: none; padding: 8px 14px; border-radius: 999px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; }
nav.tabs button svg { width: 18px; height: 18px; }
nav.tabs button[aria-current="page"] { background: var(--ink); color: var(--bg); }
.badge { background: var(--tag); color: var(--tag-ink); font-family: var(--mono); font-size: 10.5px; border-radius: 999px; padding: 0 6px; line-height: 17px; min-width: 17px; text-align: center; }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 999px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); background: transparent; }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn svg { width: 16px; height: 16px; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); width: 38px; height: 38px; border-radius: 999px; display: inline-grid; place-items: center; flex: none; }
.iconbtn svg { width: 18px; height: 18px; }

main { padding-block: 20px 120px; }
.banner { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px 16px; margin-bottom: 16px; }
.banner b { display: block; }
.banner.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }

.viewhead { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.viewhead h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 800; }
.viewhead .sub { color: var(--muted); font-family: var(--mono); font-size: 12.5px; letter-spacing: .02em; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.search { flex: 1 1 220px; min-width: 0; position: relative; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 14px 9px 38px; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); }
select.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 12px; font-weight: 500; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.chip .n { font-family: var(--mono); font-weight: 400; font-size: 11.5px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.chip.zero:not([aria-pressed="true"]) { color: var(--muted); }
.chip.ghost { background: transparent; border-style: dashed; color: var(--accent); }
.chip.tab { border-radius: 8px; }
.chip.tab .badge { margin-left: 2px; }
.chip.on { background: var(--tag); color: var(--tag-ink); border-color: transparent; }
.chips.facets { margin-bottom: 6px; }
.carelist { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.caregroups { display: grid; gap: 12px; }
.caregroups .togglegroup .chip { font-size: 13px; padding: 5px 11px; }
dl.props dd .chip.link { margin-right: 6px; }
.chip svg { width: 14px; height: 14px; }
.chip .dot { margin-right: 0; }
.rowlbl { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); align-self: center; padding-right: 2px; flex: none; }
.chip.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; font-size: inherit; }
.brandsugs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.brandsugs .chip { padding: 4px 10px; font-size: 13px; }
.catlist { display: grid; gap: 10px; }
.catrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.catrow .moves { display: grid; gap: 2px; }
.catrow .moves button { border: 0; background: none; padding: 0; width: 26px; height: 18px; display: grid; place-items: center; color: var(--muted); }
.catrow .moves button:disabled { opacity: .25; }
.catrow .moves svg { width: 16px; height: 16px; }
.catrow input { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 10px; width: 100%; min-width: 0; }
.catrow .count { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.catrow .words { grid-column: 2 / -1; }
.catrow .words input { font-size: 14px; padding: 6px 10px; }
.catrow .confirm { grid-column: 1 / -1; }
.catrow .confirm select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 8px; }
.filterpanel { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; margin-bottom: 14px; display: grid; gap: 12px; }
.lbl, .field label { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.filterpanel .lbl { display: block; margin-bottom: 6px; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.sw { width: 30px; height: 30px; border-radius: 999px; border: 1px solid var(--line); padding: 0; }
.sw[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.sw.multi { background: conic-gradient(#c23b33, #e8c547, #4f7a4a, #4a78c2, #7f5aa6, #c23b33) !important; }

.tray { border: 1.5px solid var(--tag); background: color-mix(in srgb, var(--tag) 28%, var(--surface)); border-radius: 18px; padding: 14px; margin-bottom: 18px; }
.tray h2 { font-size: 18px; }
.tray p { margin: 2px 0 10px; color: var(--muted); font-size: 13.5px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.todocard { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.todomiss { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; }
.todomiss span { font-size: 11.5px; line-height: 1; padding: 4px 7px; border-radius: 999px; border: 1px dashed var(--line); color: var(--muted); }
.todomiss span.on { border-style: solid; border-color: var(--ink); color: var(--ink); }
@media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
.card { border: 0; padding: 0; background: var(--surface); border-radius: var(--r); text-align: left; overflow: hidden; position: relative; display: flex; flex-direction: column; box-shadow: var(--shadow); transition: transform .15s ease; min-width: 0; }
.card:hover { transform: translateY(-2px); }
.stage { aspect-ratio: 4 / 5; background: var(--stage); display: grid; place-items: center; padding: 12px; max-width: 100%; position: relative; overflow: hidden; }
/* pinned inside the frame: in a grid a long, narrow photo (jeans) would otherwise grow past the 4:5 box */
.stage img { position: absolute; inset: 12px; width: calc(100% - 24px); height: calc(100% - 24px); object-fit: contain; filter: drop-shadow(0 6px 10px rgba(0,0,0,.12)); }
.stage .ph { color: var(--muted); width: 44px; height: 30px; opacity: .5; }
.card .meta { padding: 10px 12px 12px; display: grid; gap: 2px; min-width: 0; }
.card .meta b { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .meta span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .meta span.wrap { white-space: normal; }
.card.gone { opacity: .55; }
/* wishlist photos are mostly shop and model shots in all shapes: fill the 4:5 frame so every card is the same size */
.card.wish .stage { padding: 0; }
.card.wish .stage img { inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; filter: none; }
.hangtag { position: absolute; top: 10px; right: 10px; background: var(--tag); color: var(--tag-ink); font-family: var(--mono); font-size: 11px; line-height: 1.2; padding: 5px 8px 5px 16px; border-radius: 3px 6px 6px 3px; transform: rotate(4deg); transform-origin: left center; box-shadow: 0 2px 4px rgba(0,0,0,.1); clip-path: polygon(8px 0, 100% 0, 100% 100%, 8px 100%, 0 50%); }
.hangtag::before { content: ""; position: absolute; left: 6px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: var(--stage); }
.hangtag small { display: block; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }

.empty { border: 1.5px dashed var(--line); border-radius: 20px; padding: 40px 20px; text-align: center; display: grid; justify-items: center; gap: 12px; }
.empty svg.hanger { width: 96px; height: 60px; color: var(--accent); }
.empty h2 { font-size: 24px; }
.empty p { color: var(--muted); max-width: 46ch; margin: 0; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; max-width: 720px; width: 100%; margin-top: 8px; text-align: left; }
@media (max-width: 640px) { .steps { grid-template-columns: 1fr; } }
.steps div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; font-size: 13.5px; }
.steps b { display: block; font-family: var(--display); font-size: 15px; margin-bottom: 2px; }

.board { position: relative; aspect-ratio: 3 / 4; background: var(--stage); border-radius: var(--r); overflow: hidden; isolation: isolate; max-width: 100%; }
.board .piece { position: absolute; display: block; height: auto; }
.board img.piece, .board .piece img { width: 100%; height: auto; pointer-events: none; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none; filter: drop-shadow(0 5px 8px rgba(0,0,0,.14)); }
.board.mini { border-radius: 0; }
.board .emptynote { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 20px; font-size: 14px; }
.ocard .meta span.occ { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }

.calhead { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.calhead h2 { font-size: 22px; min-width: 9ch; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .dow { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); text-align: center; padding-bottom: 2px; }
.day { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; aspect-ratio: 3 / 4; padding: 0; position: relative; overflow: hidden; text-align: left; min-width: 0; }
.day.out { opacity: .35; }
.day .num { position: absolute; top: 5px; left: 7px; font-family: var(--mono); font-size: 12px; z-index: 3; background: color-mix(in srgb, var(--surface) 80%, transparent); border-radius: 6px; padding: 0 4px; }
.day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.day.today .num { background: var(--accent); color: var(--accent-ink); }
.day .thumb { position: absolute; inset: 0; }
.day .thumb .board { height: 100%; aspect-ratio: auto; }
.day .thumb img.single { width: 100%; height: 100%; object-fit: contain; padding: 18px 6px 6px; }
.day .plan { position: absolute; bottom: 4px; right: 4px; z-index: 3; font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .06em; background: var(--tag); color: var(--tag-ink); border-radius: 4px; padding: 1px 4px; }
.calnote { margin-top: 14px; color: var(--muted); font-size: 13.5px; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

const CITIES = [{ k: 'alm', name: 'Almere', lat: 52.37, lon: 5.22 }, { k: 'ams', name: 'Amsterdam', lat: 52.37, lon: 4.90 }];

const WMO = [[0, '☀️', 'Clear'], [1, '🌤️', 'Mostly clear'], [2, '⛅', 'Partly cloudy'], [3, '☁️', 'Cloudy'], [48, '🌫️', 'Fog'], [57, '🌦️', 'Drizzle'], [67, '🌧️', 'Rain'], [77, '🌨️', 'Snow'], [82, '🌧️', 'Showers'], [86, '🌨️', 'Snow showers'], [99, '⛈️', 'Thunderstorm']];
const wmo = c => WMO.find(w => c <= w[0]) || WMO[WMO.length - 1];
const WX_DAILY = 'daily=weather_code,temperature_2m_max,temperature_2m_min';
// kept on this device per city and day, so the calendar and today's strip work offline too
const WX = { days: {}, at: 0, months: [], ...pref.get('wx', {}) };
const wxDay = (date, city = 'ams') => WX.days[city]?.[date];
let wxBusy = false;
const wxAsked = new Set();
function wxStore(json) {
  (Array.isArray(json) ? json : [json]).forEach((r, i) => {
    const d = r.daily, box = WX.days[CITIES[i].k] = WX.days[CITIES[i].k] || {};
    (d?.time || []).forEach((t, j) => {
      if (d.temperature_2m_max[j] == null) return;
      box[t] = { c: d.weather_code[j], hi: Math.round(d.temperature_2m_max[j]), lo: Math.round(d.temperature_2m_min[j]), p: d.precipitation_probability_max?.[j] ?? box[t]?.p ?? null };
    });
  });
  pref.set('wx', WX);
}
async function wxFetch(base, extra) {
  const r = await fetch(`${base}?latitude=${CITIES.map(c => c.lat).join(',')}&longitude=${CITIES.map(c => c.lon).join(',')}&timezone=Europe%2FAmsterdam&${extra}`);
  if (!r.ok) throw new Error('weather ' + r.status);

// the last month plus 16 days ahead, refreshed every 3 hours
async function wxRefresh() {
  if (wxBusy || Date.now() - WX.at < 3 * 36e5) return;
  wxBusy = true;
  try { wxStore(await wxFetch('https://api.open-meteo.com/v1/forecast', `${WX_DAILY},precipitation_probability_max&past_days=31&forecast_days=16`)); WX.at = Date.now(); pref.set('wx', WX); render(); }
  catch (e) { console.warn(e); } finally { wxBusy = false; }
}
// older months come from the archive, once, when you page back in the calendar
async function wxMonth(y, mo) {
  const key = iso(new Date(y, mo, 1)).slice(0, 7), first = iso(new Date(y, mo, 1)), last = iso(new Date(y, mo + 1, 0));
  const t = new Date(), cutoff = iso(new Date(t.getFullYear(), t.getMonth(), t.getDate() - 30));
  if (first >= cutoff || WX.months.includes(key) || wxAsked.has(key)) return;
  wxAsked.add(key);
  try {
    wxStore(await wxFetch('https://archive-api.open-meteo.com/v1/archive', `${WX_DAILY}&start_date=${first}&end_date=${last < cutoff ? last : cutoff}`));
    if (last < cutoff) WX.months.push(key);
    pref.set('wx', WX); render();
  } catch (e) { console.warn(e); }
}
const wxText = w => `${wmo(w.c)[2]} · ${w.hi}° / ${w.lo}°${w.p != null ? ` · ${w.p}% rain` : ''}`;
function wxStrip() {
  const t = today(), now = CITIES.map(c => [c, wxDay(t, c.k)]).filter(x => x[1]);
  if (!now.length) return '';
  const b = new Date(), next = [];
  for (let i = 1; i <= 7; i++) {
    const d = new Date(b.getFullYear(), b.getMonth(), b.getDate() + i), k = iso(d), w = wxDay(k);
    if (w) next.push(`<button class="wxday" data-day="${k}" aria-label="${d.toLocaleDateString('en-GB', { weekday: 'long' })}: ${esc(wxText(w))}"><span class="lbl">${d.toLocaleDateString('en-GB', { weekday: 'short' })}</span><span class="ic" aria-hidden="true">${wmo(w.c)[1]}</span><b>${w.hi}°</b><span>${w.lo}°</span></button>`);

const TYPE_OCC = { City: ['Casual', 'Going out'], Beach: ['Beachwear', 'Casual'], Business: ['Officewear'], Wedding: ['Formal', 'Going out'], 'Weekend away': ['Casual'], Hiking: ['Activewear', 'Casual'], Ski: ['Activewear', 'Casual'], Festival: ['Going out', 'Casual'] };
const SLOT_LABELS = ['Travel', 'Daytime', 'Evening', 'Dinner', 'Active', 'Beach'];

/* weather at the destination: the forecast where it reaches, otherwise last year's weather on the same dates */
const TWX = pref.get('twx', {});
const twxKey = t => t.dest?.lat != null ? `${(+t.dest.lat).toFixed(2)},${(+t.dest.lon).toFixed(2)}` : null;
const tripWxDay = (t, date) => TWX[twxKey(t)]?.days?.[date];
const twxBusy = new Set();
async function ensureTripWx(t) {
  const key = twxKey(t); if (!key || twxBusy.has(key)) return;
  const c = TWX[key] = TWX[key] || { at: 0, days: {} };
  const n = new Date(), off = k => iso(new Date(n.getFullYear(), n.getMonth(), n.getDate() + k));
  const minF = off(-31), maxF = off(15), stale = Date.now() - c.at > 6 * 36e5;
  const need = tripDates(t).filter(d => !c.days[d] || (d >= off(0) && d <= maxF && (c.days[d].typical || stale)));
  if (!need.length) return;
  twxBusy.add(key);
  const base = `latitude=${t.dest.lat}&longitude=${t.dest.lon}&timezone=auto&daily=weather_code,temperature_2m_max,temperature_2m_min`;
  const get = async url => { const r = await fetch(url); if (!r.ok) throw new Error('weather ' + r.status); return r.json(); };
  const store = (j, shift) => { const d = j.daily; (d?.time || []).forEach((day, i) => { if (d.temperature_2m_max[i] == null) return; const k = shift ? iso(new Date(+day.slice(0, 4) + 1, +day.slice(5, 7) - 1, +day.slice(8, 10))) : day; c.days[k] = { c: d.weather_code[i], hi: Math.round(d.temperature_2m_max[i]), lo: Math.round(d.temperature_2m_min[i]), p: d.precipitation_probability_max?.[i] ?? null, typical: !!shift }; }); };
  const yearBack = s => `${+s.slice(0, 4) - 1}${s.slice(4)}`;
  try {
    if (need.some(d => d >= minF && d <= maxF)) { store(await get(`https://api.open-meteo.com/v1/forecast?${base},precipitation_probability_max&past_days=31&forecast_days=16`)); c.at = Date.now(); }
    const old = need.filter(d => d < minF); if (old.length) store(await get(`https://archive-api.open-meteo.com/v1/archive?${base}&start_date=${old[0]}&end_date=${old[old.length - 1]}`));
    const fut = need.filter(d => d > maxF); if (fut.length) store(await get(`https://archive-api.open-meteo.com/v1/archive?${base}&start_date=${yearBack(fut[0])}&end_date=${yearBack(fut[fut.length - 1])}`), true);
    pref.set('twx', TWX); render();
  } catch (e) { console.warn(e); } finally { twxBusy.delete(key); }
}
const wxBadge = w => w ? `<span class="twx" title="${esc(wmo(w.c)[2])}${w.typical ? ' (last year on this date)' : ''}">${wmo(w.c)[1]} ${w.hi}°/${w.lo}°${w.typical ? '*' : ''}</span>` : '';

/* capsule: enough for the longest stretch between laundry days, matching the weather and the kind of trip */
function suggestCapsule(t) {
  const w = tripDates(t).map(d => tripWxDay(t, d)).filter(Boolean);
  const avgHi = w.length ? w.reduce((a, x) => a + x.hi, 0) / w.length : null, minLo = w.length ? Math.min(...w.map(x => x.lo)) : null;
  const seasons = avgHi == null ? [seasonNow()] : avgHi >= 22 ? ['Summer'] : avgHi >= 15 ? ['Spring', 'Summer', 'Autumn'] : avgHi >= 8 ? ['Autumn', 'Spring', 'Winter'] : ['Winter', 'Autumn'];
  const occ = new Set((t.types || []).flatMap(x => TYPE_OCC[x] || [])); if (!occ.size) occ.add('Casual');
  const days = Math.max(1, t.days | 0), cuts = [...(t.laundry || [])].map(Number).sort((a, b) => a - b);
  let D = 0, prev = 0; for (const c of [...cuts, days - 1]) { D = Math.max(D, c - prev + 1); prev = c + 1; }
  D = Math.max(1, Math.min(D, days));
  const want = {
    tops: Math.min(7, Math.ceil(D * 0.8)), bottoms: Math.min(4, Math.ceil(D / 3) + 1),
    dresses: occ.has('Formal') || occ.has('Going out') || occ.has('Beachwear') ? Math.min(3, Math.ceil(D / 3)) : 0,
    knitwear: avgHi == null || avgHi < 17 ? Math.min(3, Math.ceil(D / 4) + 1) : 0, outerwear: minLo == null || minLo < 14 ? 1 : 0,
    shoes: Math.min(3, 1 + (occ.size > 1 ? 1 : 0) + (D > 4 ? 1 : 0)), bags: occ.has('Going out') || occ.has('Formal') ? 2 : 1, accessories: 2,
    activewear: occ.has('Activewear') ? Math.min(3, Math.ceil(D / 2)) : 0, swim: occ.has('Beachwear') ? 2 : 0
  };
  const have = new Set((t.pack || []).map(p => p.id));
  const fits = it => !(it.seasons || []).length || it.seasons.some(s => seasons.includes(s));
  const score = it => ((it.occasions || []).some(o => occ.has(o)) ? 3 : 0) + ((it.seasons || []).length ? 1 : 0) + Math.min(wearCount(it), 20) / 10;
  const list = [];
  for (const [key, n] of Object.entries(want)) {
    if (!n) continue;
    const inCat = S.items.filter(i => inCloset(i) && catKey(i.cat) === key);
    const already = inCat.filter(i => have.has(i.id)).length;
    list.push(...inCat.filter(i => !have.has(i.id) && fits(i)).sort((a, b) => score(b) - score(a)).slice(0, Math.max(0, n - already)));
  }
  const why = [avgHi != null ? `around ${Math.round(avgHi)}°${w.some(x => x.typical) ? ' (last year)' : ''}` : 'no weather yet', [...occ].join(', ').toLowerCase(), `outfits for ${D} day${D > 1 ? 's' : ''}${cuts.length ? ' between laundry days' : ''}`].join(' · ');
  return { list, why };
}

function shareTrip(t) {

  const special = { '1-1': 'Happy New Year!', '12-24': 'Cosy Christmas Eve.', '12-25': 'Merry Christmas!', '12-31': 'Last day of the year. Make it a nice one.', '2-14': "Happy Valentine's Day.", '4-27': 'Happy King’s Day!' }[md];

    morning: wd === 1 ? 'A fresh week starts today. One step at a time.' : wd === 5 ? 'Happy Friday! Almost weekend.' : wd === 0 || wd === 6 ? `Slow ${day} morning. Enjoy it.` : `Here is your ${day}.`,
    afternoon: wd === 0 || wd === 6 ? `Enjoy the rest of your ${day}.` : wd === 5 ? 'Friday afternoon. The weekend is close.' : `Halfway through your ${day}. Keep going.`,
    evening: wd === 0 ? 'Sunday evening. Get ready for a good week.' : wd === 5 ? 'Friday evening. You made it through the week.' : `Time to slow down this ${day} evening.`

// Adds pieces from a backup or import file; pieces already here (same id or import key) are skipped
async function importFile(file, progress) {
  const data = JSON.parse(await file.text());
  const items = Array.isArray(data.items) ? data.items : [];
  const haveKeys = new Set(S.items.map(i => i.importKey).filter(Boolean)), haveIds = new Set(S.items.map(i => i.id));
  const todo = items.filter(i => !(i.importKey && haveKeys.has(i.importKey)) && !(i.id && haveIds.has(i.id)));
  let done = 0;
  const brands = new Set((S.prefs.brands || []).map(norm)), newBrands = [];
  for (const raw of todo) {
    const { id, photoData, catKey, cutout, ...rest } = raw;
    const doc = { colors: [], seasons: [], tags: [], occasions: [], care: {}, ...rest, updated: Date.now() };
    if (catKey && catName(catKey)) doc.cat = catName(catKey);
    if (!doc.cat) doc.cat = cats()[0];
    progress(`Importing ${done + 1} of ${todo.length}: ${doc.name || 'piece'}…`);
    if (photoData) {
      let blob = await (await fetch(photoData)).blob();
      // photos on a plain background (e.g. from Indyx screenshots) get the same cut-out as the editor's "Remove background"
      if (cutout) blob = await cutOut(blob).catch(() => blob);
      doc.photo = await uploadPhoto(blob);
    }
    await DB.put('items', id || uuid(), doc);
    if (doc.brand && !brands.has(norm(doc.brand))) { brands.add(norm(doc.brand)); newBrands.push(doc.brand); }
    done++;
  }
  if (newBrands.length) await DB.savePrefs({ brands: [...(S.prefs.brands || []), ...newBrands] }).catch(console.error);
  return { done, skipped: items.length - todo.length };
}
// Import cut-out. A dark piece keeps about the same shape at any sensitivity; a white top on a white background
// mostly disappears at the normal one, so then a much gentler fill is used. Background enclosed by the piece
// (inside a bag handle, between a strap and a shoe) is cleared afterwards.
async function cutOut(blob) {
  Object.assign(PE, { changed: false, mode: 'view' });

  const n = PE.w * PE.h;
  const run = tol => { PE.tol = tol; PE.autoBefore = null; PE.cur = new ImageData(new Uint8ClampedArray(PE.orig.data), PE.w, PE.h); peAuto(); let k = 0; for (let i = 3; i < PE.cur.data.length; i += 4) if (PE.cur.data[i] > 12) k++; return k / n; };
  const normal = pref.get('tol', 34), gentle = 8;
  const kGentle = run(gentle), kNormal = run(normal);
  const tol = kGentle > kNormal * 2 && kGentle > 0.05 ? gentle : normal;
  if (tol !== normal) run(tol);
  clearHoles(Math.min(20, tol * 0.6));
  const out = await peExport();
  PE.cur = null; PE.tol = pref.get('tol', 34);
  return out || blob;
}
function clearHoles(tol) {
  const d = PE.orig.data, a = PE.cur.data, w = PE.w, n = w * PE.h, T = tol * tol;
  const border = []; for (let x = 0; x < w; x++) border.push(x, n - w + x); for (let y = 1; y < PE.h - 1; y++) border.push(y * w, y * w + w - 1);
  const med = ch => { const v = border.map(p => d[p * 4 + ch]).sort((x, y) => x - y); return v[v.length >> 1]; };
  const m = [med(0), med(1), med(2)];
  const near = p => a[p * 4 + 3] > 12 && (d[p * 4] - m[0]) ** 2 + (d[p * 4 + 1] - m[1]) ** 2 + (d[p * 4 + 2] - m[2]) ** 2 < T;
  const seen = new Uint8Array(n), st = new Int32Array(n), min = n * 0.002;
  for (let i = 0; i < n; i++) {
    if (seen[i] || !near(i)) continue;
    const region = []; let sp = 0; st[sp++] = i; seen[i] = 1;
    while (sp) {
      const p = st[--sp], x = p % w; region.push(p);
      for (const q of [x > 0 ? p - 1 : -1, x < w - 1 ? p + 1 : -1, p - w, p + w]) if (q >= 0 && q < n && !seen[q] && near(q)) { seen[q] = 1; st[sp++] = q; }
    }
    if (region.length > min) for (const p of region) a[p * 4 + 3] = 0;
  }
}

async function fullBackup(btn) {
  const say = m => { document.querySelectorAll('[data-fullmsg], [data-cimportmsg]').forEach(el => el.textContent = m); };
  btn.disabled = true;
  try {
    say('Getting ready…');
    if (!window.JSZip) await new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
    const data = { app: 'A’s Life', exported: new Date().toISOString(), items: S.items, outfits: S.outfits, days: S.days, prefs: S.prefs, records: window.LIFE?.records?.() || [] };
    const json = JSON.stringify(data, null, 1), zip = new JSZip();
    zip.file('backup.json', json);
    const paths = [...new Set(json.match(/[0-9a-f-]{36}\/[0-9a-f-]{36}\.(?:jpe?g|png|webp)/gi) || [])];
    let done = 0, failed = 0;
    const one = async p => { try { const r = await fetch(photoURL(p)); if (!r.ok) throw 0; zip.file('photos/' + p, await r.blob(), { binary: true, compression: 'STORE' }); } catch { failed++; } done++; if (done % 10 === 0 || done === paths.length) say(`Photos ${done} of ${paths.length}…`); };
    for (let i = 0; i < paths.length; i += 6) await Promise.all(paths.slice(i, i + 6).map(one));

    say(`Ready: ${paths.length - failed} photos${failed ? `, ${failed} could not be fetched` : ''}, ${Math.round(blob.size / 1e6)} MB.`);

    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  } catch (err) { console.error(err); say('The backup did not work. Check your connection and try again.'); }

}

/* ---------- picking the item-only shop photo ---------- */
// Shops mix product shots with photos of models. A product shot has a plain background around the item
// and (almost) no skin, so each candidate gets a score and the lowest wins.
async function scorePhoto(path) {
  const img = await loadImage(photoURL(path));
  const sc = Math.min(1, 160 / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(8, Math.round(img.naturalWidth * sc)), h = Math.max(8, Math.round(img.naturalHeight * sc));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true }); ctx.drawImage(img, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data, n = w * h;
  const border = [];
  for (let x = 0; x < w; x++) border.push(x, (h - 1) * w + x);
  for (let y = 1; y < h - 1; y++) border.push(y * w, y * w + w - 1);
  // only border pixels that look like the background seed the fill, so a model cut off at the edge isn't eaten
  const med = ch => { const v = border.map(p => d[p * 4 + ch]).sort((a, b) => a - b); return v[v.length >> 1]; };
  const m = [med(0), med(1), med(2)];
  const seeds = border.filter(p => d[p * 4 + 3] < 16 || (d[p * 4] - m[0]) ** 2 + (d[p * 4 + 1] - m[1]) ** 2 + (d[p * 4 + 2] - m[2]) ** 2 < 48 ** 2);
  const bg = floodMask(d, w, h, seeds, 30);
  let fg = 0, skin = 0, edge = 0;
  for (let i = 0; i < n; i++) {
    if (bg[i] || d[i * 4 + 3] < 16) continue;
    fg++;
    const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2], mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    if (r > 95 && g > 40 && b > 20 && mx - mn > 15 && Math.abs(r - g) > 15 && r > g && r > b) skin++;
  }
  for (const p of border) if (!bg[p] && d[p * 4 + 3] >= 16) edge++;
  if (fg < n * 0.02) return 9;
  return (skin / fg) * 4 + Math.max(0, fg / n - 0.7) * 3 + (edge / border.length) * 1.5;
}
const picking = new Set();
async function autoPickPhotos() {
  for (const it of inboxItems()) {
    if (it.scored || picking.has(it.id) || (it.candidates || []).length < 2) continue;
    picking.add(it.id);
    try {
      const scores = await Promise.all(it.candidates.map(p => scorePhoto(p).catch(() => 99)));
      const best = it.candidates[scores.indexOf(Math.min(...scores))];
      const cur = S.byId[it.id]; if (!cur || !isInbox(cur)) continue;
      const { id, ...data } = cur;
      await DB.put('items', id, { ...data, photo: best, scored: true });
    } catch (e) { console.error(e); }
  }
}

/* ---------- categories ---------- */
function openCategories() {
  const countOf = name => S.items.filter(i => i.cat === name).length;
  const C = S.cats.map(c => ({ key: c.key, name: c.name, words: [...(c.words || [])], orig: c.name, count: countOf(c.name) }));
  const removed = [];
  const sh = sheet({
    title: 'Categories',
    body: `<p class="muted" style="margin:0">Rename, reorder, add or remove categories. Renaming moves every piece along with it. "Link words" help the app recognise the category when you share a shop link.</p>
      <div class="catlist" id="catList"></div>
      <div><button class="btn" id="catAdd">${I.plus} Add category</button></div>`,
    foot: `<span class="busy" id="catStatus"></span><div class="spacer"></div><button class="btn" data-close>Cancel</button><button class="btn primary" id="catSave">Save categories</button>`
  });
  const list = $('#catList', sh);
  const draw = () => {
    list.innerHTML = C.map((c, i) => `<div class="catrow" data-i="${i}">
      <div class="moves"><button type="button" data-up aria-label="Move ${esc(c.name)} up" ${i === 0 ? 'disabled' : ''}>${I.up}</button><button type="button" data-down aria-label="Move ${esc(c.name)} down" ${i === C.length - 1 ? 'disabled' : ''}>${I.down}</button></div>
      <input data-name value="${esc(c.name)}" aria-label="Category name" placeholder="Category name">
      <span class="count">${c.count} ${c.count === 1 ? 'piece' : 'pieces'}</span>
      <button type="button" class="iconbtn" data-del aria-label="Remove ${esc(c.name)}">${I.x}</button>
      <div class="words"><input data-words value="${esc(c.words.join(', '))}" placeholder="Link words, e.g. jewellery, sieraden" aria-label="Link words for ${esc(c.name)}"></div>
      ${c.confirm ? `<div class="confirm">Move its ${c.count} ${c.count === 1 ? 'piece' : 'pieces'} to <select data-moveto>${C.filter((_, j) => j !== i).map(o => `<option value="${esc(o.key)}">${esc(o.name)}</option>`).join('')}</select> and remove it? <button type="button" class="btn small danger" data-delyes>Remove</button><button type="button" class="btn small" data-delno>Keep</button></div>` : ''}
    </div>`).join('');
  };
  draw();
  list.addEventListener('input', e => {
    const row = e.target.closest('[data-i]'); if (!row) return; const c = C[+row.dataset.i];
    if (e.target.matches('[data-name]')) c.name = e.target.value;
    if (e.target.matches('[data-words]')) c.words = e.target.value.split(',').map(w => w.trim().toLowerCase()).filter(Boolean);
  });
  list.addEventListener('click', e => {
    const row = e.target.closest('[data-i]'); if (!row) return; const i = +row.dataset.i;
    if (e.target.closest('[data-up]') && i > 0) { [C[i - 1], C[i]] = [C[i], C[i - 1]]; draw(); }
    if (e.target.closest('[data-down]') && i < C.length - 1) { [C[i + 1], C[i]] = [C[i], C[i + 1]]; draw(); }
    if (e.target.closest('[data-del]')) {
      if (C.length === 1) { $('#catStatus', sh).textContent = 'Keep at least one category.'; return; }
      if (!C[i].count) { const [c] = C.splice(i, 1); if (c.orig) removed.push({ orig: c.orig, to: null }); draw(); }
      else { C[i].confirm = true; draw(); }
    }
    if (e.target.closest('[data-delno]')) { C[i].confirm = false; draw(); }
    if (e.target.closest('[data-delyes]')) { const to = $('[data-moveto]', row).value; const [c] = C.splice(i, 1); removed.push({ orig: c.orig, to }); draw(); }
  });
  $('#catAdd', sh).addEventListener('click', () => {
    C.push({ key: 'c' + uuid().slice(0, 8), name: '', words: [], orig: null, count: 0 }); draw();
    list.lastElementChild.querySelector('[data-name]').focus();
  });
  $('#catSave', sh).addEventListener('click', async () => {
    const st = $('#catStatus', sh), btn = $('#catSave', sh);
    C.forEach(c => c.name = c.name.trim());
    if (C.some(c => !c.name)) { st.textContent = 'Every category needs a name.'; return; }
    const lower = C.map(c => c.name.toLowerCase());
    if (new Set(lower).size !== lower.length) { st.textContent = 'Two categories have the same name.'; return; }
    // where each old category name ends up: renamed, or moved into another category when removed
    const nameByKey = Object.fromEntries(C.map(c => [c.key, c.name]));
    const moves = {};
    for (const c of C) if (c.orig && c.orig !== c.name) moves[c.orig] = c.name;
    for (const r of removed) if (r.to) moves[r.orig] = nameByKey[r.to];
    const rows = S.items.filter(i => moves[i.cat]).map(i => { const { id, ...data } = i; return { id, data: { ...data, cat: moves[i.cat], updated: Date.now() } }; });
    btn.disabled = true; st.textContent = rows.length ? `Updating ${rows.length} pieces…` : 'Saving…';
    try {
      await DB.savePrefs({ categories: C.map(c => ({ key: c.key, name: c.name, words: c.words })) });
      await DB.putMany('items', rows);
      for (const f of Object.values(S.fv)) if (f.cat !== 'All' && !cats().includes(f.cat)) f.cat = moves[f.cat] || 'All';
      closeSheet(); toast('Categories saved'); render();
    } catch (err) { saveErr(err, 'Could not save categories. Try again.'); st.textContent = ''; btn.disabled = false; }
  });
}

function shuffleOutfit() {
  const season = seasonNow();
  const pool = S.items.filter(i => inCloset(i) && i.photo && (!(i.seasons || []).length || i.seasons.includes(season)));
  // by category key, so renamed categories still shuffle; a deleted one just never gets picked
  const pick = key => { const l = pool.filter(i => catKey(i.cat) === key); return l.length ? l[Math.floor(Math.random() * l.length)] : null; };
  const chosen = [];
  const dress = pick('dresses'), top = pick('tops') || pick('knitwear'), bottom = pick('bottoms');
  if (dress && (Math.random() < 0.4 || !(top && bottom))) chosen.push(dress);
  else { if (top) chosen.push(top); if (bottom) chosen.push(bottom); }
  if (Math.random() < (season === 'Autumn' || season === 'Winter' ? 0.8 : 0.3)) { const o = pick('outerwear'); if (o) chosen.push(o); }
  const shoe = pick('shoes'); if (shoe) chosen.push(shoe);
  if (Math.random() < 0.6) { const b = pick('bags'); if (b) chosen.push(b); }
  if (Math.random() < 0.4) { const a = pick('accessories'); if (a) chosen.push(a); }

  const order = { outerwear: 1, dresses: 2, bottoms: 2, tops: 3, knitwear: 3, shoes: 5, bags: 6, accessories: 7 };

    const b = e.target.closest('[data-b]')?.dataset.b, p = B.pieces[B.sel]; if (!b || !p) return;

    if (b === 'smaller') resize(0.88);
    if (b === 'bigger') resize(1.12);
    if (b === 'front') p.z = Math.max(...B.pieces.map(q => q.z || 0)) + 1;
    if (b === 'back') p.z = Math.min(...B.pieces.map(q => q.z || 0)) - 1;
    if (b === 'remove') { B.pieces.splice(B.sel, 1); B.sel = -1; }
    drawBoard();
  });
  $('#bShuffle', sh).addEventListener('click', () => { closeSheet(); shuffleOutfit(); });
  $('#bSave', sh).addEventListener('click', async () => {
    const st = $('#bStatus', sh), btn = $('#bSave', sh);
    if (!B.pieces.length) { st.textContent = 'Add at least one piece.'; return; }
    btn.disabled = true; st.textContent = 'Saving…';
    const round = v => Math.round(v * 10) / 10;
    const doc = { name: $('#o-name', sh).value.trim() || 'Untitled outfit', occasion: $('#o-occ', sh).value.trim(),
      pieces: B.pieces.map(p => ({ id: p.id, x: round(p.x), y: round(p.y), w: round(p.w), z: p.z })), created: src?.created || Date.now(), updated: Date.now() };
    try {
      const oid = id || uuid();
      await DB.put('outfits', oid, doc); closeSheet(); toast('Outfit saved'); setTimeout(() => openOutfit(oid), 80);
    } catch (err) { st.textContent = !navigator.onLine ? "You're offline." : 'Could not save. Try again.'; console.error(err); btn.disabled = false; }
  });
  drawBoard();
  S.sheetRefresh = drawPicks;
}

/* ---------- day sheet ---------- */
async function photoToJpeg(file, max = 1400) {
  const img = await loadImage(file);
  const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  const b = await toBlob(c, 'image/jpeg', 0.85);
  if (!b) throw new Error('encode');
  return b;
}
function openDay(date, opts = {}) {
  const rec = S.days[date] || {};
  const D = { outfit: opts.outfit || rec.outfit || null, items: [...(rec.items || [])], cat: 'All', photos: [...(rec.photos || [])], adds: [], removed: [] };
  D.mode = D.outfit || !D.items.length ? 'outfit' : 'pieces';
  const future = date > today();
  const sh = sheet({
    title: fromISO(date).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }),
    body: `${CITIES.some(c => wxDay(date, c.k)) ? `<div class="wxcities">${CITIES.map(c => { const w = wxDay(date, c.k); return w ? `<div><span class="lbl" style="display:block">${c.name}</span><span aria-hidden="true">${wmo(w.c)[1]}</span> ${esc(wmo(w.c)[2])} · <b>${w.hi}° / ${w.lo}°</b>${w.p != null ? ` · ${w.p}% rain` : ''}</div>` : ''; }).join('')}</div>` : ''}
      <div><span class="lbl">Your look</span><div class="daypics" id="dayPics"></div>
        <input type="file" id="lookFile" class="vh" accept="image/*" multiple>
        <p class="muted" style="font-size:12.5px;margin:6px 0 0">A mirror selfie or any photo of you wearing it. Up to 4 per day.</p></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="muted">${future ? 'Plan what you will wear.' : 'What you wore. Each piece counts one wear.'}</span><div class="spacer"></div>
      <div class="seg" role="group"><button data-mode="outfit">Saved outfit</button><button data-mode="pieces">Pick pieces</button></div></div>
      <div id="dayPick"></div>
      <div class="field"><label for="d-place">Where${rec.place ? ` <button type="button" class="chip link" data-place="${esc(rec.place)}">All days at ${esc(rec.place)}</button>` : ''}</label><input id="d-place" list="placeList" value="${esc(rec.place || '')}" placeholder="Work, a dinner, a city" autocomplete="off"><datalist id="placeList">${places().map(([p]) => `<option value="${esc(p)}">`).join('')}</datalist>
        ${places().length ? `<div class="chips" style="margin-top:6px">${places().slice(0, 8).map(([p]) => `<button type="button" class="chip" data-fillplace="${esc(p)}">${esc(p)}</button>`).join('')}</div>` : ''}</div>
      <div class="field"><label for="d-note">Note</label><input id="d-note" value="${esc(rec.note || '')}" placeholder="How it felt"></div>`,
    foot: `<span class="busy" id="dStatus"></span><div class="spacer"></div>${S.days[date] ? '<button class="btn danger" id="dClear">Clear day</button>' : ''}<button class="btn primary" id="dSave">${future ? 'Save plan' : 'Save'}</button>`,
    onClose: () => D.adds.forEach(a => URL.revokeObjectURL(a.url))
  });
  const drawPics = () => {
    const pics = [...D.photos.map((p, i) => ({ src: photoURL(p), key: 'p' + i })), ...D.adds.map((a, i) => ({ src: a.url, key: 'a' + i }))];
    $('#dayPics', sh).innerHTML = pics.map(p => `<div class="daypic"><img src="${esc(p.src)}" crossorigin="anonymous" alt="Your look"><button type="button" data-rmpic="${p.key}" aria-label="Remove photo">${I.x}</button></div>`).join('')
      + (pics.length < 4 ? `<label class="daypic add" for="lookFile">${I.camera}<span>Add photo</span></label>` : '');
  };
  const draw = () => {
    $$('[data-mode]', sh).forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === D.mode));
    const host = $('#dayPick', sh);
    if (D.mode === 'outfit') {
      host.innerHTML = S.outfits.length ? `<div class="outpick">${S.outfits.map(o => `<button data-dout="${esc(o.id)}" aria-pressed="${D.outfit === o.id}">${boardHTML(o.pieces)}<span>${esc(o.name || 'Outfit')}</span></button>`).join('')}</div>`
        : `<p class="muted">No saved outfits yet. Switch to "Pick pieces", or build an outfit first.</p>`;
    } else {
      const pool = S.items.filter(inCloset);
      const counts = {}; pool.forEach(i => counts[i.cat] = (counts[i.cat] || 0) + 1);
      host.innerHTML = `<div class="chips">${['All', ...cats()].filter(c => c === 'All' || counts[c]).map(c => `<button class="chip" data-dcat="${esc(c)}" aria-pressed="${D.cat === c}">${esc(c)}</button>`).join('')}</div>
        <div class="pickgrid">${pool.filter(i => D.cat === 'All' || i.cat === D.cat).map(i => `<button class="pick" data-ditem="${esc(i.id)}" aria-pressed="${D.items.includes(i.id)}" title="${esc(i.name)}">${i.photo ? pimg(i.photo, i.name, 'loading="lazy"') : `<span style="font-size:11px">${esc(i.name)}</span>`}</button>`).join('') || '<p class="muted">Your closet is empty.</p>'}</div>
        <p class="muted" style="font-size:13px;margin:6px 0 0">${D.items.length} selected</p>`;
    }
  };
  drawPics(); draw();
  const file = $('#lookFile', sh);
  file.addEventListener('change', () => {
    for (const f of [...file.files].slice(0, 4 - D.photos.length - D.adds.length)) D.adds.push({ file: f, url: URL.createObjectURL(f) });
    file.value = ''; drawPics();
  });
  if (opts.addPhoto && D.photos.length + D.adds.length < 4) file.click();
  sh.addEventListener('click', async e => {
    const fp = e.target.closest('[data-fillplace]'); if (fp) { $('#d-place', sh).value = fp.dataset.fillplace; return; }
    const rm = e.target.closest('[data-rmpic]')?.dataset.rmpic;
    if (rm) {
      const i = +rm.slice(1);
      if (rm[0] === 'p') D.removed.push(...D.photos.splice(i, 1));
      else { URL.revokeObjectURL(D.adds[i].url); D.adds.splice(i, 1); }
      drawPics(); return;
    }
    const m = e.target.closest('[data-mode]'); if (m) { D.mode = m.dataset.mode; draw(); return; }
    const o = e.target.closest('[data-dout]'); if (o) { D.outfit = D.outfit === o.dataset.dout ? null : o.dataset.dout; draw(); return; }
    const c = e.target.closest('[data-dcat]'); if (c) { D.cat = c.dataset.dcat; draw(); return; }
    const it = e.target.closest('[data-ditem]'); if (it) { toggleIn(D.items, it.dataset.ditem); draw(); return; }
    if (e.target.closest('#dClear')) {
      try { await DB.del('days', date); [...(rec.photos || [])].forEach(deletePhoto); closeSheet(); toast('Day cleared'); } catch (err) { saveErr(err, 'Could not clear. Try again.'); }
    }
    if (e.target.closest('#dSave')) {
      const st = $('#dStatus', sh), btn = $('#dSave', sh);
      const outfit = D.mode === 'outfit' ? D.outfit : null, items = D.mode === 'pieces' ? D.items : [];
      if (!outfit && !items.length && !D.photos.length && !D.adds.length) { st.textContent = 'Add a photo, an outfit or some pieces.'; return; }
      btn.disabled = true;
      try {
        // move each photo over once it's uploaded, so a retry after a failure doesn't upload it twice
        while (D.adds.length) {
          st.textContent = `Uploading photo… (${D.adds.length} left)`;
          D.photos.push(await uploadPhoto(await photoToJpeg(D.adds[0].file)));
          URL.revokeObjectURL(D.adds.shift().url);
        }
        st.textContent = 'Saving…';
        await DB.put('days', date, { outfit, items, note: $('#d-note', sh).value.trim(), photos: D.photos, place: $('#d-place', sh).value.trim() });
        D.removed.forEach(deletePhoto);
        closeSheet(); toast(future ? 'Planned' : 'Logged');
      } catch (err) {
        st.textContent = !navigator.onLine ? "You're offline. Try again when you're connected." : 'Could not save. Try again.';
        console.error(err); btn.disabled = false; drawPics();
      }
    }
  });
}

/* ---------- boot ---------- */
$('#addBtn').addEventListener('click', () => isLife(S.view) ? window.LIFE.add(S.view) : S.view === 'trips' ? openTripEditor(null) : openEditor(null, S.view === 'wishlist' ? { wish: true } : {}));
S.fv = { closet: newFilter(pref.get('sort:closet', pref.get('sort', 'new'))), wishlist: newFilter(pref.get('sort:wishlist', 'new')) };
const h0 = (location.hash || '').slice(1), h = ({ 'inbox/review': 'wish/inbox', 'inbox/saved': 'care/saved', 'wish/saved': 'care/saved' })[h0] || h0;
// the app opens on the overview; a link with #page still opens that page
S.view = okView(h) ? h : 'overview';

async function start(session) {
  if (UID === session.user.id) return;
  UID = session.user.id; EMAIL = session.user.email || '';
  S.status = cacheLoad() ? 'ok' : 'connecting';
  derive(); $('#main').innerHTML = ''; render();
  await obFlush(); // send changes made offline before loading fresh data over them
  subscribeLive(); wxRefresh();
  // what life.js needs from the closet: the signed-in Supabase client, photos, sheets and settings
  const lifeLoad = window.LIFE?.start({ sb, uid: () => UID, view: () => S.view, outfits: () => S.outfits.map(o => ({ id: o.id, name: o.name || 'Outfit', board: boardHTML(o.pieces) })), go, render, sheet, closeSheet, toast, uuid, photoURL, uploadPhoto, deletePhoto, photoToJpeg, prefs: () => S.prefs, savePrefs: patch => DB.savePrefs(patch), undoPush, closetWish: () => S.items.filter(isWish).map(it => ({ id: it.id, name: it.name, brand: it.brand, price: it.price, photo: it.photo, since: it.wishSince || (it.created ? iso(new Date(it.created)) : ''), url: it.url, shop: it.shop, planBuy: it.planBuy || '' })),
    undoQuiet, sbWrite, sbWriteMany, obFlush, uploadFile,
    // call one of your Supabase functions as you (signed in)
    callFn,

    trips: () => trips(), saveTrip: t => saveTrip(t), tripDates: t => tripDates(t), tripProgress: t => tripProgress(t),
    tripEdit: id => openTripEditor(id || null, true), tripPack: id => { S.tripUI = { ...(S.tripUI || {}), id, tab: 'pack', home: false }; go('trips'); },
    // a closet wish bought through Finance: into the closet at the price paid; hands back what it was, for undo
    closetBuy: async (id, { price, bought, tx }) => { const before = noId(S.byId[id]), { planBuy, ...rest } = before; await DB.put('items', id, { ...rest, status: 'closet', price, bought, tx, updated: Date.now() }); return before; },
    closetRestore: (id, data) => data ? DB.put('items', id, data) : DB.del('items', id),
    // a closet wish from the inbox; hands back null, so undo removes it again
    closetAdd: async (id, data) => { await DB.put('items', id, { ...data, status: 'wishlist', wishSince: today(), created: Date.now(), updated: Date.now() }); return null; },
    closetPatch: (id, patch) => DB.put('items', id, { ...noId(S.byId[id]), ...patch, updated: Date.now() }),
    // closet wishes that left the list: bought (in the closet now) or let go (wishlist archive)
    closetDone: () => S.items.filter(it => it.wishSince && !isWish(it) && !isInbox(it)).map(it => isPassed(it) ? { name: it.name, price: it.price, out: 'dropped', date: it.passedDate || '' } : { name: it.name, price: it.price, out: 'bought', date: it.bought || '' }), openItem: id => openItem(id) });
  try { await loadAll(); await lifeLoad; purgePhotos(); } catch (e) { console.error(e); S.status = 'offline'; render(); }
  const qd = /^#do=(\w+)/.exec(location.hash || ''); if (qd) { try { history.replaceState(null, '', '#' + S.view); } catch {} quickAction(qd[1]); }
}
if (!window.supabase || !CFG.url || !CFG.key || /YOUR-/.test(CFG.url + CFG.key)) {
  if (!window.supabase && CFG.url && !/YOUR-/.test(CFG.url) && (UID = pref.get('lastUid', null))) {

  } else renderSetupMissing();
} else {
  sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'hangtag-auth' } });

}
if ('serviceWorker' in navigator && location.protocol === 'https:') {
